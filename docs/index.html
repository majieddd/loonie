<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>loonie</title>

<!--
  Direction A (Swiss Monochrome) as the shell, with three grafts:

    · from B  — the threshold-margin chart. Each gate drawn as
                (value − threshold) / |threshold|, sign-flipped for <= gates so
                right is always safer. It is the only transform that puts a
                t-statistic, a trade count and three probabilities on one axis.

    · from robinhood.com (measured 2026-09-16, not recalled) — the hierarchy.
                Portfolio value is the one large number, at the top, weight 400.
                Ground #000 and zero box-shadows are theirs too; both were
                measured, and both happen to agree with A.

    · from tradingview.com (measured 2026-09-16) — the working scale. Every
                figure that is not the hero sits at 11–14px, separated by 1px
                hairlines rather than cards. Up/down is #22AB94 / #F23645, a
                teal-shifted pair that survives deuteranopia where pure
                red/green collapses.

  Motif: every quantity this system reports is a measured value against a
  declared limit. One element — a rule, a threshold tick, a value mark —
  is reused for the gates, the risk limits, the sealed holdout, the trial
  deflation and the universe coverage.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#000; --panel:#0a0a0b; --line:#1f1f22; --line-2:#2e2e33;
  --fg:#fff; --fg-2:#8d8d96; --fg-3:#82828c;
  --up:#22ab94; --down:#f23645; --live:#ccff00; --warn:#e3a008;
  --sans:"Geist",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;border-radius:0}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
     font-variant-numeric:tabular-nums}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 96px}

/* ── masthead ─────────────────────────────────────────────────────── */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
     padding:20px 0 18px;border-bottom:1px solid var(--line)}
.mark{font-size:19px;font-weight:500;letter-spacing:-.035em}
.tag{font:400 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
     color:var(--fg-2);border:1px solid var(--line-2);padding:5px 8px}
.top .sp{flex:1}
.live{display:inline-flex;align-items:center;gap:7px;font:400 11px/1 var(--mono);
      letter-spacing:.1em;text-transform:uppercase;color:var(--fg-2)}
.dot{width:6px;height:6px;background:var(--live);display:block}
.dot.stale{background:var(--warn)} .dot.dead{background:var(--down)}
@media(prefers-reduced-motion:no-preference){
  .dot{animation:blip 2.4s ease-in-out infinite}
  @keyframes blip{0%,100%{opacity:1}50%{opacity:.25}}
}

/* ── hero: the one large number ───────────────────────────────────── */
.hero{padding:44px 0 8px}
.hero .lbl{font:400 11px/1 var(--mono);letter-spacing:.14em;
           text-transform:uppercase;color:var(--fg-2)}
.value{font-size:clamp(46px,7.4vw,76px);font-weight:300;letter-spacing:-.035em;
       line-height:1.02;margin:14px 0 0;font-variant-numeric:tabular-nums}
.delta{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
       margin-top:12px;font-size:16px}
.delta .amt{font-weight:500}
.delta .since{color:var(--fg-2);font:400 12px/1 var(--mono);letter-spacing:.04em}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--fg-2)}

.spark{margin:26px 0 0;width:100%;height:132px;display:block}
.spark-x{display:flex;justify-content:space-between;
         font:400 11px/1 var(--mono);color:var(--fg-3);
         padding-top:8px;border-top:1px solid var(--line)}

/* ── stat strip ───────────────────────────────────────────────────── */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
       border-top:1px solid var(--line);margin-top:34px}
.stat{padding:16px 18px 18px;border-right:1px solid var(--line);
      border-bottom:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat .k{font:400 11px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;
         color:var(--fg-2)}
.stat .v{font-size:23px;font-weight:400;letter-spacing:-.02em;margin-top:9px}
.stat .s{font:400 11px/1.4 var(--mono);color:var(--fg-3);margin-top:5px}

/* ── sections ─────────────────────────────────────────────────────── */
section{padding-top:76px}
.head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
      padding-bottom:10px;border-bottom:1px solid var(--line-2)}
.num{font:400 11px/1 var(--mono);color:var(--fg-3);letter-spacing:.1em}
h2{font-size:20px;font-weight:400;letter-spacing:-.02em;margin:0}
.head .note{margin-left:auto;font:400 11px/1 var(--mono);color:var(--fg-2);
            letter-spacing:.06em;text-transform:uppercase}
.lede{color:var(--fg-2);font-size:14.5px;line-height:1.65;
      max-width:70ch;margin:18px 0 30px}
.lede b{color:var(--fg);font-weight:500}

/* ── tables (tradingview working scale) ───────────────────────────── */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:400 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
   color:var(--fg-2);text-align:left;padding:0 12px 9px 0;
   border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:9px 12px 9px 0;border-bottom:1px solid var(--line);
   white-space:nowrap;vertical-align:baseline}
th.r,td.r{text-align:right;padding-right:0;padding-left:20px}
tbody tr:hover{background:var(--panel)}
.sym{font:500 13px/1 var(--mono);letter-spacing:.02em}
.mono{font-family:var(--mono);font-size:12.5px}
.dim{color:var(--fg-2)}
.expr{font-family:var(--mono);font-size:11.5px;color:var(--fg-2);
      white-space:normal;word-break:break-all;line-height:1.5;
      max-width:430px;min-width:260px}
.why{font-family:var(--mono);font-size:11px;color:var(--down);
     white-space:normal;line-height:1.5;max-width:230px;padding-left:20px}

/* ── gate: threshold-margin chart (from direction B) ──────────────── */
.gate-row{display:grid;grid-template-columns:168px 88px 1fr 84px;
          align-items:center;gap:14px;padding:11px 0;
          border-bottom:1px solid var(--line)}
.gate-row .name{font:400 12px/1.3 var(--mono);letter-spacing:.02em}
.gate-row .rd{font:400 12.5px/1 var(--mono);text-align:right}
.gate-row .mg{font:500 12px/1 var(--mono);text-align:right}
.bar{position:relative;height:16px}
.bar .axis{position:absolute;left:50%;top:-6px;bottom:-6px;width:1px;
           background:var(--line-2)}
.bar .fill{position:absolute;top:3px;height:10px;background:var(--up)}
.bar .fill.bad{background:var(--down)}
.bar .clip{position:absolute;top:0;width:9px;height:16px;
           border-left:1px solid var(--bg);border-right:1px solid var(--bg);
           background:repeating-linear-gradient(115deg,var(--bg) 0 2px,transparent 2px 4px)}
.gate-scale{display:flex;justify-content:space-between;
            font:400 11px/1 var(--mono);color:var(--fg-3);
            letter-spacing:.08em;padding-top:10px}
.fail-row{background:rgba(242,54,69,.07)}
.void-row .name,.void-row .rd{color:var(--fg-3)}



/* -- the method: four loops, stated plainly ------------------------- */
.method{border-top:1px solid var(--line);margin-top:40px}
.loop{display:grid;grid-template-columns:22px 1fr 1fr 118px;gap:20px;
      align-items:baseline;padding:18px 0;border-bottom:1px solid var(--line)}
.loop .n{font:400 11px/1.5 var(--mono);color:var(--fg-3)}
.loop .what{font:500 14px/1.4 var(--sans);letter-spacing:-.01em}
.loop .what i{display:block;font:400 12px/1.5 var(--mono);color:var(--fg-3);
              font-style:normal;margin-top:5px}
.loop .cred{font:400 12.5px/1.5 var(--mono);color:var(--fg-2)}
.loop .cred b{display:block;font-size:11px;letter-spacing:.11em;
              text-transform:uppercase;color:var(--fg-3);font-weight:400;
              margin-bottom:5px}
.loop .when{font:400 11px/1.5 var(--mono);color:var(--fg-3);text-align:right}
.claim{margin:30px 0 0;padding:18px 0 0;border-top:1px solid var(--line-2);
       font:400 14.5px/1.65 var(--sans);color:var(--fg-2);max-width:74ch}
.claim b{color:var(--fg);font-weight:500}
.cite{margin-top:16px;font:400 12px/1.8 var(--mono);color:var(--fg-3)}
.cite a{color:var(--fg-2);text-decoration:none;
        border-bottom:1px solid var(--line-2)}
.cite a:hover{color:var(--fg);border-color:var(--fg-2)}
@media(max-width:820px){
  .loop{grid-template-columns:22px 1fr;gap:6px 16px}
  .loop .cred,.loop .when{grid-column:2/-1}
  .loop .when{text-align:left}
}

/* ── live activity: who is running and what they are doing ────────── */
.crew{border-top:1px solid var(--line);margin-top:34px}
.crew-row{display:grid;grid-template-columns:14px 132px 1fr 190px 96px;
          align-items:center;gap:14px;padding:12px 0;
          border-bottom:1px solid var(--line)}
.crew-row .led{width:8px;height:8px;display:block;background:var(--fg-3)}
.crew-row .led.live{background:var(--up)}
.crew-row .led.stale{background:var(--warn)}
.crew-row .led.dead{background:var(--down)}
.crew-row .led.finished{background:var(--fg-3)}
@media(prefers-reduced-motion:no-preference){
  .crew-row .led.live{animation:blip 2.4s ease-in-out infinite}
}
.crew-row .who{font:500 12.5px/1.3 var(--mono);letter-spacing:.02em}
.crew-row .who i{display:block;font:400 11px/1.3 var(--mono);
                 color:var(--fg-3);font-style:normal;margin-top:3px}
.crew-row .doing{font:400 12.5px/1.4 var(--mono);color:var(--fg-2);
                 white-space:normal;word-break:break-word}
.crew-row .nums{font:400 11px/1.5 var(--mono);color:var(--fg-3);text-align:right}
.crew-row .age{font:400 11px/1 var(--mono);color:var(--fg-3);text-align:right}
.crew-row.is-dead .doing{color:var(--down)}
.pbar{height:4px;background:var(--line);margin-top:7px;position:relative}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--fg-2);display:block}
@media(max-width:820px){
  .crew-row{grid-template-columns:14px 1fr 84px}
  .crew-row .nums{grid-column:2/-1;text-align:left}
}

/* ── misc ─────────────────────────────────────────────────────────── */
.grid2{display:grid;gap:34px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;
    border-bottom:1px solid var(--line);font-size:13px}
.kv .k{color:var(--fg-2);font-family:var(--mono);font-size:12px}
.kv .v{font-family:var(--mono);font-size:12.5px;text-align:right}
.pill{display:inline-block;font:400 11px/1 var(--mono);letter-spacing:.1em;
      text-transform:uppercase;padding:4px 7px;border:1px solid var(--line-2);
      color:var(--fg-2)}
.pill.ok{color:var(--up);border-color:var(--up)}
.pill.bad{color:var(--down);border-color:var(--down)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.meter{height:6px;background:var(--line);margin-top:9px;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;background:var(--fg-2);display:block}
.meter i.bad{background:var(--down)}
/* data sources: one row per source, all bars on the same scale so the
   shortest one is what the eye lands on first */
.src{padding:18px 0 20px;border-bottom:1px solid var(--line)}
.src:last-child{border-bottom:0}
.src-h{display:flex;justify-content:space-between;align-items:baseline;gap:20px}
.src-n{font-size:14px;letter-spacing:-.01em}
.src-o{font:400 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
       color:var(--fg-3);margin-left:11px}
.src-f{display:flex;align-items:baseline;gap:16px;white-space:nowrap}
.src-c{font:400 11.5px/1 var(--mono);color:var(--fg-3)}
.src-p{font:400 14px/1 var(--mono);font-variant-numeric:tabular-nums}
.src-p.bad{color:var(--down)}
.src-note{margin:11px 0 0;font-size:12.5px;line-height:1.55;color:var(--fg-2);
          max-width:62ch;text-wrap:pretty}
.src-note.dim{color:var(--fg-3);font-family:var(--mono);font-size:11px;
              margin-top:7px}
@media(max-width:560px){
  .src-h{flex-direction:column;align-items:flex-start;gap:7px}
  .src-o{margin-left:0;display:block}
}
.foot{margin-top:72px;padding-top:22px;border-top:1px solid var(--line);
      color:var(--fg-3);font:400 11.5px/1.7 var(--mono)}
.foot b{color:var(--fg-2);font-weight:400}
.err{border:1px solid var(--down);color:var(--down);padding:14px 16px;
     margin:24px 0;font:400 13px/1.6 var(--mono)}
#boot{padding:80px 0;color:var(--fg-2);font-family:var(--mono);font-size:13px}
@media(max-width:720px){
  .wrap{padding:0 16px 72px}
  .gate-row{grid-template-columns:1fr 78px;gap:6px 12px}
  .gate-row .bar,.gate-row .mg{grid-column:1/-1}
  .gate-row .mg{text-align:left}
  .stat{border-right:0}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="mark">loonie</span>
    <span class="tag" id="mode">paper</span>
    <span class="tag" id="nolive">not live money</span>
    <span class="sp"></span>
    <span class="live"><i class="dot" id="dot"></i><span id="age">connecting…</span></span>
  </div>
  <div id="boot">loading live state…</div>
  <main id="app" hidden></main>
</div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const el = (t, c, txt) => { const n=document.createElement(t); if(c)n.className=c;
  if(txt!=null)n.textContent=txt; return n; };

const money = v => (v<0?"−":"")+"$"+Math.abs(v).toLocaleString("en-US",
  {minimumFractionDigits:2, maximumFractionDigits:2});
const pct = (v,d=2) => (v>0?"+":v<0?"−":"")+Math.abs(v*100).toFixed(d)+"%";
const num = (v,d=2) => v==null||!isFinite(v) ? "—" : Number(v).toFixed(d);
const int = v => v==null ? "—" : Number(v).toLocaleString("en-US");
const dirC = v => v>0?"up":v<0?"down":"flat";

function ago(iso){
  if(!iso) return "unknown";
  const s = (Date.now()-new Date(iso).getTime())/1000;
  if (s < 0) return "just now";
  if (s < 90) return Math.round(s)+"s ago";
  if (s < 5400) return Math.round(s/60)+"m ago";
  if (s < 172800) return Math.round(s/3600)+"h ago";
  return Math.round(s/86400)+"d ago";
}

/* ── sparkline ────────────────────────────────────────────────────── */
function sparkline(values, {w=1120, h=132, color="var(--up)"}={}){
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.setAttribute("preserveAspectRatio","none");
  svg.setAttribute("class","spark");
  const v = values.filter(x => isFinite(x));
  if (v.length < 2) return svg;

  const lo = Math.min(...v), hi = Math.max(...v), span = (hi-lo) || 1;
  const pad = 6;
  const x = i => (i/(v.length-1))*w;
  const y = d => pad + (1-(d-lo)/span)*(h-pad*2);
  const pts = v.map((d,i)=>`${x(i).toFixed(2)},${y(d).toFixed(2)}`).join(" ");

  // Baseline = first value, so the fill reads as gain/loss against the start.
  const base = y(v[0]);
  const zero = document.createElementNS(svg.namespaceURI,"line");
  zero.setAttribute("x1",0); zero.setAttribute("x2",w);
  zero.setAttribute("y1",base); zero.setAttribute("y2",base);
  zero.setAttribute("stroke","var(--line-2)");
  zero.setAttribute("stroke-width","1");
  zero.setAttribute("stroke-dasharray","2 4");
  svg.appendChild(zero);

  const area = document.createElementNS(svg.namespaceURI,"polygon");
  area.setAttribute("points", `0,${base} ${pts} ${w},${base}`);
  area.setAttribute("fill", color);
  area.setAttribute("opacity","0.10");
  svg.appendChild(area);

  const line = document.createElementNS(svg.namespaceURI,"polyline");
  line.setAttribute("points", pts);
  line.setAttribute("fill","none");
  line.setAttribute("stroke", color);
  line.setAttribute("stroke-width","1.5");
  line.setAttribute("vector-effect","non-scaling-stroke");
  svg.appendChild(line);
  return svg;
}

function miniLine(values, {w=300,h=40,color="var(--fg-2)"}={}){
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox",`0 0 ${w} ${h}`);
  svg.setAttribute("preserveAspectRatio","none");
  svg.style.width="100%"; svg.style.height=h+"px"; svg.style.display="block";
  const v = values.filter(x=>isFinite(x));
  if (v.length<2) return svg;
  const lo=Math.min(...v), hi=Math.max(...v), span=(hi-lo)||1;
  const pts = v.map((d,i)=>`${(i/(v.length-1)*w).toFixed(2)},${(3+(1-(d-lo)/span)*(h-6)).toFixed(2)}`).join(" ");
  const p = document.createElementNS(svg.namespaceURI,"polyline");
  p.setAttribute("points",pts); p.setAttribute("fill","none");
  p.setAttribute("stroke",color); p.setAttribute("stroke-width","1.25");
  p.setAttribute("vector-effect","non-scaling-stroke");
  svg.appendChild(p);
  return svg;
}

/* ── the threshold-margin transform (direction B) ─────────────────── */
// Every gate becomes (value − threshold)/|threshold|, sign-flipped for "<="
// gates so that right of the rule is always safer. A t-statistic, a trade
// count and three probabilities cannot otherwise share an axis.
function margin(g){
  const t = Number(g.threshold), v = Number(g.value);
  if (!isFinite(v) || !isFinite(t)) return null;
  if (Math.abs(t) < 1e-9){
    // A margin relative to a zero threshold is not a ratio. Return the raw
    // signed distance and let the caller label it as such, rather than
    // printing a percentage that divides by an arbitrary 1.
    return { m: g.op === "<=" ? -v : v, absolute: true };
  }
  const m = (v - t) / Math.abs(t);
  return { m: g.op === "<=" ? -m : m, absolute: false };
}

function gateRows(gates){
  const box = el("div");
  gates.forEach(g => {
    const mr = margin(g);
    const m = mr && mr.m;
    const unmeasured = mr === null;
    const row = el("div","gate-row" + (unmeasured ? " void-row"
                  : g.pass ? "" : " fail-row"));
    row.appendChild(el("div","name", g.name));
    row.appendChild(el("div","rd", unmeasured ? "—"
      : (Math.abs(g.value) >= 1000 ? int(g.value) : num(g.value, 3))
        + "  " + g.op + " " + num(g.threshold, g.threshold >= 100 ? 0 : 2)));

    const bar = el("div","bar");
    bar.appendChild(el("i","axis"));
    if (!unmeasured){
          const cap = 1;                   // ±100% of the threshold
      const clipped = Math.abs(m) > cap;
      // Absolute-distance gates have no ratio scale; clamp them to the full
      // half-width so the bar still shows direction without implying a ratio.
      const frac = mr.absolute ? 1 : Math.min(Math.abs(m), cap) / cap;
      const fill = el("i","fill" + (g.pass ? "" : " bad"));
      const half = frac * 50;
      if (m >= 0){ fill.style.left = "50%"; fill.style.width = half + "%"; }
      else { fill.style.left = (50 - half) + "%"; fill.style.width = half + "%"; }
      bar.appendChild(fill);
      if (clipped && !mr.absolute){
        // Broken-axis notation: this bar runs off the scale, true value printed.
        const c = el("i","clip");
        c.style.left = m >= 0 ? "calc(100% - 11px)" : "2px";
        bar.appendChild(c);
      }
    }
    row.appendChild(bar);
    row.appendChild(el("div","mg " + (unmeasured ? "dim" : g.pass ? "up" : "down"),
      unmeasured ? "not measured"
        : mr.absolute ? (m>0?"+":"−") + num(Math.abs(m),3) + " abs"
        : Math.abs(m) > 9.99 ? (m>0?"+":"−") + Math.round(Math.abs(m)*100) + "%"
        : pct(m, 1)));
    box.appendChild(row);
  });
  const sc = el("div","gate-scale");
  ["−100% of threshold","THRESHOLD","+100%"].forEach(t => sc.appendChild(el("span",null,t)));
  box.appendChild(sc);
  return box;
}

/* ── table helper ─────────────────────────────────────────────────── */
function table(cols, rows){
  const wrap = el("div","scroll"), t = el("table");
  const thead = el("thead"), tr = el("tr");
  cols.forEach(c => {
    // Header cells need the column class too, or their padding does not match
    // the body and adjacent headings run together.
    const th = el("th", [c.r?"r":"", c.cls||""].join(" ").trim() || null, c.h);
    tr.appendChild(th);
  });
  thead.appendChild(tr); t.appendChild(thead);
  const tb = el("tbody");
  if (!rows.length){
    const r = el("tr"), td = el("td","dim","nothing to show");
    td.colSpan = cols.length; r.appendChild(td); tb.appendChild(r);
  }
  rows.forEach(row => {
    const tr = el("tr");
    cols.forEach(c => {
      const td = el("td", [c.r?"r":"", c.cls||""].join(" ").trim() || null);
      const out = c.f(row);
      if (out instanceof Node) td.appendChild(out); else td.innerHTML = out;
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  t.appendChild(tb); wrap.appendChild(t); return wrap;
}

function section(n, title, note){
  const s = el("section"), h = el("div","head");
  h.appendChild(el("span","num", n));
  h.appendChild(el("h2", null, title));
  if (note) h.appendChild(el("span","note", note));
  s.appendChild(h);
  return s;
}



/* -- the method, stated before any number is shown ------------------ */
function methodSection(snap){
  const S = snap.search || {}, E = snap.experience || {}, D = snap.data || {};
  const sec = section("01", "How it learns", "four loops, no language model");

  const box = el("div","method");
  const LOOPS = [
    ["01", "Genetic program", "mutates and recombines expression trees",
     "cross-validated alpha vs an equal-weight universe", "every generation"],
    ["02", "Operator bandit", "picks which mutation to apply",
     "did the child beat the parent it modified", "every generation"],
    ["03", "Feature bandit", "picks which input families to draw from",
     "survival on a window fitness never sees", "every generation"],
    ["04", "Method bandit", "picks how to search at all",
     "forward alpha, pooled across every run recorded", "every cycle"],
  ];
  LOOPS.forEach(function(L){
    const row = el("div","loop");
    row.appendChild(el("i","n", L[0]));

  const claim = el("p","claim");
  claim.innerHTML =
    "Every loop is credited by something it cannot fake. The inner loops could "+
    "each be gamed by the thing that scores them, so the outer two are judged "+
    "only on a window the search never sees. <b>The generator and the evaluator "+
    "share no parameters</b> &mdash; a genetic program proposes, a backtest "+
    "decides &mdash; which is the failure a 2026 survey of 1,250 "+
    "self-improvement papers calls a self-confirming loop, and the reason no "+
    "language model runs here.";
  sec.appendChild(claim);

  const cite = el("div","cite");
  cite.innerHTML =
    "Cross-read against seven papers &mdash; <a href='research.html'>the method "+
    "and its limits</a>, including where the literature says this design is "+
    "<b>wrong</b>. Synthesis: <a href='memory.html'>a model-agnostic memory "+
    "substrate</a>.";
  sec.appendChild(cite);

  const h = el("div","head"); h.style.marginTop = "48px";
  h.appendChild(el("span","num","01b"));
  h.appendChild(el("h2",null,"What it trains on"));
  h.appendChild(el("span","note", int(E.labelled || 0) + " labelled outcomes kept"));
  sec.appendChild(h);

  const kv = function(k,v){ const r=el("div","kv");
    r.appendChild(el("span","k",k)); r.appendChild(el("span","v",v)); return r; };
  const g2 = el("div","grid2"); g2.style.marginTop = "22px";

  const left = el("div");

    (snap.config.universe_start || "?") + "  to  " + (snap.seal.start || "?")));
  left.appendChild(kv("universe", int(D.fetched || 0) + " of " +
    int(D.universe_size || 0) + " names ever in the index"));
  left.appendChild(kv("coverage", num((D.coverage || 0) * 100, 1) + "%"));
  left.appendChild(kv("regime series", "16 macro, causal, z-scored"));
  left.appendChild(kv("strategies evaluated", int(S.trials || 0)));
  left.appendChild(kv("independent hypotheses", int(S.trials_effective || 0)));
  g2.appendChild(left);

  const right = el("div");
  right.appendChild(kv("experience corpus", int(E.rows || 0) + " rows"));
  right.appendChild(kv("with a forward label", int(E.labelled || 0)));
  right.appendChild(kv("distinct strategies", int(E.distinct_strategies || 0)));
  right.appendChild(kv("runs / methods tried",

  right.appendChild(kv("holdout", snap.seal.evaluations + " of " +

/* ── live activity ────────────────────────────────────────────────── */
function crewSection(snap){
  const W = (snap.workers && snap.workers.workers) || [];
  const live = (snap.workers && snap.workers.live) || 0;
  const fin = W.filter(function(w){ return w.liveness === "finished"; }).length;
  const sec = section("02", "Running now",
    live + " live" + (fin ? " · " + fin + " completed" : "") +
    (W.length > live + fin ? " · " + (W.length - live - fin) + " stale" : ""));
  sec.appendChild(Object.assign(el("p","lede"),{innerHTML:
    "Every worker writes a heartbeat; liveness is read from how old that "+
    "heartbeat is, never from a self-reported flag — a hung process leaves "+
    "<span class='mono'>running:true</span> behind forever but cannot fake a "+
    "fresh timestamp."}));

  const box = el("div","crew");
  if (!W.length){
    box.appendChild(Object.assign(el("div","crew-row"),{textContent:
      "no workers reporting — start with: python scripts/run_system.py"}));
    sec.appendChild(box);
    return sec;
  }

  W.forEach(w => {
    const row = el("div","crew-row" + (w.liveness === "dead" ? " is-dead" : ""));
    row.appendChild(el("i","led " + w.liveness));

    const who = el("div","who", w.label || w.id);
    who.appendChild(Object.assign(el("i"),{textContent:
      w.kind + (w.cycle ? " · cycle " + int(w.cycle) : "")}));
    row.appendChild(who);

    const doing = el("div");
    doing.appendChild(el("div","doing",
      w.liveness === "dead" ? "last heartbeat " + ago(w.heartbeat)
                            : (w.detail || w.status || "—")));
    if (w.progress != null){
      const pb = el("div","pbar"); const pi = el("i");
      pi.style.width = (100 * w.progress).toFixed(1) + "%";
      pb.appendChild(pi); doing.appendChild(pb);
    }
    row.appendChild(doing);

    const m = w.metrics || {};
    const keys = Object.keys(m).slice(0, 4);
    const nums = el("div","nums");
    keys.forEach(k => {
      const v = m[k];
      const txt = (typeof v === "number")
        ? (Number.isInteger(v) ? int(v) : num(v, 3))
        : String(v);
      nums.appendChild(el("div", null, k.replace(/_/g, " ") + "  " + txt));
    });
    row.appendChild(nums);
    row.appendChild(el("div","age", ago(w.heartbeat)));
    box.appendChild(row);
  });
  sec.appendChild(box);

  const V = snap.validation_history || [];
  if (V.length){
    const h = el("div","head"); h.style.marginTop = "40px";
    h.appendChild(el("span","num","02b"));
    h.appendChild(el("h2",null,"Walk-forward history"));
    h.appendChild(el("span","note", int(V.length) + " runs"));
    sec.appendChild(h);
    sec.appendChild(Object.assign(el("p","lede"),{innerHTML:
      "The honest sequential walk-forward, re-run on a schedule. One number is "+
      "a measurement; the sequence is the only thing that shows whether the "+
      "procedure is <b>decaying</b> — the failure a self-improving system is "+
      "least able to notice from the inside."}));
    sec.appendChild(table([
      {h:"when", f:r=>(r.at||"").replace("T"," ").replace("+00:00","Z")},
      {h:"strategy", r:true, cls:"mono", f:r=>r.strategy||"—"},
      {h:"benchmark", r:true, cls:"mono", f:r=>r.benchmark||"—"},
      {h:"excess", r:true, cls:"mono", f:r=>r.excess||"—"},
      {h:"alpha t", r:true, cls:"mono", f:r=>r.alpha_t||"—"},
      {h:"segments won", r:true, cls:"mono", f:r=>r.segments_won||"—"},
    ], V.slice().reverse().slice(0,12)));
  }
  return sec;
}


/* ── meta: what the system has learned about how to search ────────── */
function metaSection(snap){
  const E = snap.experience || {};
  const M = snap.methods || [];
  const F = snap.family_forward_rates || {};
  if (!E.rows && !M.length) return null;

  const sec = section("07", "Meta-learning",
    int(E.labelled || 0) + " labelled outcomes");
  sec.appendChild(Object.assign(el("p","lede"),{innerHTML:
    "Three loops learn inside one method; this one learns <b>between</b> "+
    "methods. Every gated candidate and its forward outcome is kept in a "+
    "parquet corpus that survives restarts, and each search cycle draws a "+
    "method by Thompson sampling over those outcomes. Credit is <b>forward "+
    "alpha, never fitness</b> — a method judged on its own score would win "+
    "by inflating it."}));

  const kv = (k,v) => { const r=el("div","kv"); r.appendChild(el("span","k",k));
    r.appendChild(el("span","v",v)); return r; };
  const g2 = el("div","grid2");

  const left = el("div");
  left.appendChild(kv("rows recorded", int(E.rows || 0)));
  left.appendChild(kv("with a forward label", int(E.labelled || 0)));
  left.appendChild(kv("distinct strategies", int(E.distinct_strategies || 0)));
  left.appendChild(kv("runs / methods", (E.runs||0)+" / "+(E.methods||0)));
  left.appendChild(kv("corpus on disk", ((E.bytes||0)/1024).toFixed(1)+" KB"));
  if (E.fwd_positive_rate != null)
    left.appendChild(kv("forward-positive", num(E.fwd_positive_rate*100,1)+"%"));
  g2.appendChild(left);

  const right = el("div");
  const fams = Object.entries(F).slice(0,8);
  if (fams.length){
    right.appendChild(Object.assign(el("div","k"),{textContent:
      "FEATURE FAMILIES BY FORWARD SURVIVAL", style:
      "font:400 11px/1 var(--mono);letter-spacing:.13em;color:var(--fg-2);"+
      "display:block;margin-bottom:10px"}));
    fams.forEach(([f,t]) => right.appendChild(
      kv(f, num(t.rate*100,1)+"%   ("+int(t.survived)+" of "+int(t.seen)+")")));
  }
  g2.appendChild(right);
  sec.appendChild(g2);

  if (M.length){
    const anyEstablished = M.some(m => m.established);
    sec.appendChild(Object.assign(el("p","lede"),{style:"margin-top:30px",
      innerHTML: anyEstablished
        ? "A method below has enough labelled outcomes to separate it from the prior."
        : "<b>No method yet has enough labelled outcomes to distinguish it from "+
          "the prior.</b> The ranking below is still noise; the bandit is "+
          "exploring. Do not act on it."}));
    sec.appendChild(table([
      {h:"method", f:r=>el("span","sym", r.id)},
      {h:"what it changes", cls:"dim", f:r=>r.summary||"—"},
      {h:"forward rate", r:true, cls:"mono",
       f:r=>r.forward_rate==null?"—":num(r.forward_rate*100,1)+"%"},
      {h:"labelled", r:true, cls:"mono", f:r=>int(r.labelled||0)},
      {h:"cycles", r:true, cls:"mono", f:r=>int(r.cycles||0)},
      {h:"established", r:true, f:r=>el("span", r.established?"up":"dim",
        r.established?"yes":"not yet")},
    ], M));
  }
  return sec;
}

    " time. Opening it is recorded in an append-only ledger before the result "+
    "can be reacted to, and the manifest hash breaks if the underlying data "+
    "changes. A window opened once means something; one opened eleven times "+
    "does not, and this is how you tell them apart.";
  seal.appendChild(note);
  g3.appendChild(seal);
  s5.appendChild(g3);
  app.appendChild(s5);

  /* 06 provenance */
  const D = snap.data||{};
  const SRC = snap.sources || [];
  const s6 = section("09","Data provenance",
    SRC.length ? SRC.length+" free sources" : null);
  s6.appendChild(Object.assign(el("p","lede"),{innerHTML:
    "Everything below is free and public. Each source reports the fraction of "+
    "its own subject it can actually see, on one scale — because coverage, "+
    "not cleverness, is the binding constraint here. Point-in-time S&P 500 "+
    "membership means the backtest may only buy what was in the index that "+
    "day, and free providers carry only securities that still exist, so "+
    "<b>"+int(D.missing_departed)+"</b> departed names are missing — every "+
    "one of them a loser the backtest cannot see."}));

  /* One row per source. A full bar is the comparison doing its job, not a
     decoration: it is what lets the short bar read first. */
  const srcRow = function(r){
    const w = el("div","src");
    const top = el("div","src-h");
    const lhs = el("div");
    lhs.appendChild(el("span","src-n", r.name || r.id));
    lhs.appendChild(el("span","src-o", r.origin || ""));
    const rhs = el("div","src-f");
    if (r.want) rhs.appendChild(el("span","src-c",
      int(r.have)+" / "+int(r.want)+"  "+(r.unit||"")));
    const c = (r.coverage == null) ? null : +r.coverage;
    const short = c != null && r.floor != null && c < r.floor;
    rhs.appendChild(el("span", short ? "src-p bad" : "src-p",
      c == null ? "—" : num(c*100,1)+"%"));
    top.appendChild(lhs); top.appendChild(rhs);
    w.appendChild(top);

    const m = el("div","meter"), i = el("i", short ? "bad" : null);
    i.style.width = ((c == null ? 0 : c)*100).toFixed(1)+"%";
    m.appendChild(i); w.appendChild(m);

    if (r.note) w.appendChild(el("p","src-note",
      r.note + (short ? " — below the "+num(r.floor*100,0)+"% floor." : "")));
    if (r.span) w.appendChild(el("p","src-note dim", r.span));
    return w;
  };
  const srcWrap = el("div"); srcWrap.style.marginTop = "26px";
  SRC.forEach(r => srcWrap.appendChild(srcRow(r)));
  if (!SRC.length) srcWrap.appendChild(el("p","src-note dim",
    "no source manifest in this snapshot"));
  s6.appendChild(srcWrap);
  app.appendChild(s6);

  /* colophon */
  const f = el("div","foot");
  f.innerHTML =
    "<b>loonie</b> — a genetic program searching stock-picking rules, gated on "+
    "statistical evidence, paper-traded only.<br>"+
    "Snapshot <b>"+(snap.generated_at||"?")+"</b> · book written <b>"+
    (P.updated||"?")+"</b> · universe from <b>"+snap.config.universe_start+
    "</b> · holdout sealed from <b>"+snap.config.holdout_start+"</b>.<br>"+
    "Backtested and paper results are hypothetical and carry no real money. "+
    "Not investment advice.";
  app.appendChild(f);

  $("#boot").hidden = true;
  app.hidden = false;
}

/* ── polling ──────────────────────────────────────────────────────── */
let lastGen = null;
async function tick(){
  try{
    const bust = "?t=" + Date.now();
    const [snap, series] = await Promise.all([
      fetch("data/snapshot.json"+bust, {cache:"no-store"}).then(r=>{
        if(!r.ok) throw new Error("snapshot "+r.status); return r.json(); }),
      fetch("data/series.json"+bust, {cache:"no-store"})
        .then(r=>r.ok?r.json():{}).catch(()=>({})),
    ]);
    if (snap.search.generation !== lastGen){
      lastGen = snap.search.generation;
      render(snap, series);
    } else {
      render(snap, series);
    }
    const s = (Date.now()-new Date(snap.generated_at).getTime())/1000;
    const dot = $("#dot");
    dot.className = "dot" + (s > 86400 ? " dead" : s > 3600 ? " stale" : "");
    $("#age").textContent = "updated " + ago(snap.generated_at);
  } catch(e){
    $("#dot").className = "dot dead";
    $("#age").textContent = "feed unreachable";
    if ($("#app").hidden){
      $("#boot").innerHTML = "<div class='err'>Could not load "+
        "<span class='mono'>data/snapshot.json</span> — "+e.message+
        "<br><br>Serve this page over HTTP rather than opening the file "+
        "directly:<br><span class='mono'>python scripts/serve.py</span></div>";
    }
  }
}
tick();
setInterval(tick, 30000);
addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
</script>
</body>
</html>
